[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repcache"
version = "1.0.0"
description = "HTTP representation reuse client (Vary/ETag/Cache-Control aware) with a SQLite cache, for scrapers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["http", "cache", "vary", "etag", "scraping"]

[project.scripts]
repcache-demo = "repcache.scrape_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
